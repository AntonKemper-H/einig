# Render Blueprint for Einig (spec: specs/c1-deployment.md).
# Render reads this file when the service is created via "New > Blueprint".
# Secrets are only listed by name here; their values are entered in Render's
# dashboard and never stored in the repository.

services:
  - type: web
    name: einig
    runtime: python
    plan: free
    # Same region as the Neon database (AWS Europe, Frankfurt), so every query stays short.
    # Render cannot move a service to another region later.
    region: frankfurt
    # No "branch:" here: Render deploys the branch chosen when the Blueprint is created
    # (feature-c1-deployment for the first test, main after the merge).
    # Python version comes from .python-version (3.12). --frozen installs exactly uv.lock.
    buildCommand: uv sync --frozen --no-dev
    # init-db only creates missing tables and never deletes data, so it is safe on every start.
    # --no-dev: without it, "uv run" would install pytest & co. on the server at every start.
    startCommand: uv run --no-dev flask --app app init-db && uv run --no-dev gunicorn --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true   # Render creates a random key once
      - key: DATABASE_URL
        sync: false           # paste the Neon/Supabase connection string in the dashboard
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_EMBED_KEY
        sync: false
